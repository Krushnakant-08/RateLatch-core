worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream rate_limiter {
        server rate-limiter:3000;
    }

    upstream management_api {
        server management-api:4000;
    }

    server {
        listen 80;
        server_name _;

        # Management API routes
        location /manage/ {
            proxy_pass http://management_api/manage/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Admin API routes
        location /admin/ {
            proxy_pass http://management_api/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # All other traffic goes through the rate limiter gateway
        location / {
            proxy_pass http://rate_limiter;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Pass through upstream response headers
            proxy_pass_request_headers on;
        }
    }
}
